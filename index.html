<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Counterline Pharmacy Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Fixed left rail on desktop, bottom tab bar on phones; content column with a slide-over record drawer. */
:root {
  --bg: #f3f6f4;
  --surface: #ffffff;
  --surface-2: #eaf0ed;
  --ink: #10201a;
  --ink-2: #44554e;
  --muted: #74857e;
  --line: #d9e2de;
  --accent: #0b7356;
  --accent-hover: #095e47;
  --accent-ink: #ffffff;
  --accent-soft: #dcf0e8;
  --rail: #0d2a21;
  --rail-ink: #cfe3db;
  --rail-muted: #7fa396;
  --rail-active: #17402f;
  --new: #2357c9;   --new-soft: #e3ebfb;
  --prog: #9a6205;  --prog-soft: #fbefd6;
  --done: #2e7d4f;  --done-soft: #e0f1e6;
  --late: #b8352a;  --late-soft: #fbe4e1;
  --shadow: 0 1px 2px rgba(16,32,26,.06), 0 8px 24px rgba(16,32,26,.08);
  --scrim: rgba(10,22,18,.42);
  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1411; --surface: #121c18; --surface-2: #1a2621; --ink: #e4ede9; --ink-2: #a7b7b0; --muted: #7b8c85; --line: #24322c;
  --accent: #3cc49a; --accent-hover: #5fd3ae; --accent-ink: #062018; --accent-soft: #143a2e;
  --rail: #08110e; --rail-ink: #cfe3db; --rail-muted: #6f9286; --rail-active: #16302a;
  --new: #7aa2ff; --new-soft: #1b2948; --prog: #f0b54a; --prog-soft: #3a2c10; --done: #5ccb8b; --done-soft: #143424; --late: #ff7a6b;
  --late-soft: #401b17; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45); --scrim: rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c1411; --surface: #121c18; --surface-2: #1a2621; --ink: #e4ede9; --ink-2: #a7b7b0; --muted: #7b8c85; --line: #24322c;
  --accent: #3cc49a; --accent-hover: #5fd3ae; --accent-ink: #062018; --accent-soft: #143a2e;
  --rail: #08110e; --rail-ink: #cfe3db; --rail-muted: #6f9286; --rail-active: #16302a;
  --new: #7aa2ff; --new-soft: #1b2948; --prog: #f0b54a; --prog-soft: #3a2c10; --done: #5ccb8b; --done-soft: #143424; --late: #ff7a6b;
  --late-soft: #401b17; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45); --scrim: rgba(0,0,0,.6); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 600; }
h3 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13px; }
.btn.danger { color: var(--late); }
.btn[disabled] { opacity: .55; pointer-events: none; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.new { color: var(--new); background: var(--new-soft); }
.pill.progress { color: var(--prog); background: var(--prog-soft); }
.pill.done { color: var(--done); background: var(--done-soft); }
.pill.overdue { color: var(--late); background: var(--late-soft); }
.pill.overdue::before { animation: blink 1.4s infinite; }
.pill.plain { color: var(--ink-2); background: var(--surface-2); }
.pill.plain::before { display: none; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
@keyframes blink { 50% { opacity: .25; } }

/* ---------- Login ---------- */
.login { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.login-art { background: var(--rail); color: var(--rail-ink); padding-block: 48px; padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; position: relative; overflow: hidden; }
.login-art .cross { position: absolute; right: -60px; bottom: -60px; width: 340px; height: 340px; opacity: .07; }
.login-art h1 { font-size: clamp(30px, 3.4vw, 44px); line-height: 1.08; color: #fff; max-width: 14ch; }
.login-art p.lead { margin-top: 16px; max-width: 46ch; color: var(--rail-muted); font-size: 15px; }
.flow { display: grid; gap: 10px; max-width: 420px; }
.flow-step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
.flow-step b { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 1px solid #2b5646; font-family: var(--f-mono); font-size: 12px; color: #9fd8c3; font-weight: 500; }
.flow-step span { padding-top: 4px; color: var(--rail-ink); }
.flow-step small { display: block; color: var(--rail-muted); font-size: 12.5px; }
.login-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--rail-muted); }
.login-meta span { display: inline-flex; gap: 6px; align-items: center; }
.login-form-wrap { display: grid; place-items: center; padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.login-card { width: 100%; max-width: 400px; display: grid; gap: 22px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
.login-art .brand { color: #fff; }
.login-art .brand-mark { background: #3cc49a; color: #062018; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input { height: 42px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); width: 100%; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.staff-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.staff-opt { display: flex; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: left; min-width: 0; }
.staff-opt:hover { border-color: var(--accent); }
.staff-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.staff-opt div { min-width: 0; }
.staff-opt strong { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.staff-opt small { display: block; font-size: 11.5px; color: var(--muted); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; color: #fff; font-family: var(--f-display); }
.avatar.sm { width: 24px; height: 24px; font-size: 10px; }
.otp { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.otp input { height: 52px; text-align: center; font-family: var(--f-mono); font-size: 20px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); width: 100%; min-width: 0; }
.otp input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.hint { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; }
.err { color: var(--late); font-size: 13px; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--rail); color: var(--rail-ink); padding: 18px 12px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; height: 100dvh; }
.rail .brand { color: #fff; padding: 4px 8px 0; font-size: 17px; }
.rail .brand-mark { background: #3cc49a; color: #062018; }
.pharm { padding: 10px 10px; border-radius: 10px; background: var(--rail-active); display: grid; gap: 2px; }
.pharm strong { font-size: 13px; color: #fff; }
.pharm small { font-size: 11.5px; color: var(--rail-muted); }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; color: var(--rail-ink); text-decoration: none; font-weight: 500; }
.nav a:hover { background: rgba(255,255,255,.05); }
.nav a[aria-current="page"] { background: var(--rail-active); color: #fff; }
.nav a[aria-current="page"] svg { color: #3cc49a; }
.nav .count { margin-left: auto; font-size: 11.5px; font-weight: 700; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; background: #3cc49a; color: #062018; }
.nav .count.alert { background: #ff7a6b; color: #2a0805; }
.rail-foot { margin-top: auto; display: grid; gap: 10px; }
.live { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--rail-muted); padding: 0 10px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #3cc49a; box-shadow: 0 0 0 0 rgba(60,196,154,.6); animation: pulse 2s infinite; flex: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(60,196,154,.55); } 70% { box-shadow: 0 0 0 8px rgba(60,196,154,0); } 100% { box-shadow: 0 0 0 0 rgba(60,196,154,0); } }
.me { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; background: transparent; border: 0; color: var(--rail-ink); text-align: left; width: 100%; }
.me:hover { background: rgba(255,255,255,.05); }
.me div { min-width: 0; flex: 1; }
.me strong { display: block; font-size: 13px; color: #fff; }
.me small { display: block; font-size: 11.5px; color: var(--rail-muted); }
.demo-box { border: 1px dashed #2b5646; border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.demo-box .eyebrow { color: var(--rail-muted); }
.demo-box button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border-radius: 7px; border: 0; background: rgba(255,255,255,.05); color: var(--rail-ink); font-size: 12.5px; text-align: left; }
.demo-box button:hover { background: rgba(255,255,255,.1); }
.switch { margin-left: auto; width: 28px; height: 16px; border-radius: 8px; background: #2b5646; position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #cfe3db; transition: left .15s; }
.switch.on { background: #3cc49a; }
.switch.on::after { left: 14px; background: #062018; }

.main { min-width: 0; padding-block: 28px 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head .sub { color: var(--muted); margin-top: 4px; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.topbar, .tabbar { display: none; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-body { padding: 16px; }

/* ---------- Tasks ---------- */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.kpi { text-align: left; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); display: grid; gap: 4px; position: relative; }
.kpi:hover { border-color: var(--muted); }
.kpi[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.kpi .k-label { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.kpi .k-label i { width: 8px; height: 8px; border-radius: 50%; }
.kpi .k-val { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .k-foot { font-size: 12px; color: var(--muted); }
.kpi.overdue-hot .k-val { color: var(--late); }

.incoming { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.incoming .ring { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; animation: ring 1.2s infinite; flex: none; }
@keyframes ring { 0%,100% { transform: rotate(0); } 10% { transform: rotate(-12deg); } 20% { transform: rotate(12deg); } 30% { transform: rotate(-8deg); } 40% { transform: rotate(0); } }
.incoming div { min-width: 0; flex: 1; }
.incoming strong { display: block; }
.incoming small { color: var(--ink-2); }
.wave { display: flex; gap: 3px; align-items: center; height: 22px; }
.wave i { width: 3px; border-radius: 2px; background: var(--accent); animation: wv 1s infinite ease-in-out; }
.wave i:nth-child(2) { animation-delay: .1s } .wave i:nth-child(3) { animation-delay: .2s } .wave i:nth-child(4) { animation-delay: .3s } .wave i:nth-child(5) { animation-delay: .4s }
@keyframes wv { 0%,100% { height: 5px; } 50% { height: 20px; } }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1 1 240px; min-width: 0; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { padding-left: 36px; height: 38px; }
.select { height: 38px; padding: 0 30px 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 16px, calc(100% - 10px) 16px; background-size: 5px 5px; background-repeat: no-repeat; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 0 12px; height: 36px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.tasks-head, .task { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.25fr) 112px 132px 116px 96px; gap: 14px; align-items: center; }
.tasks-head { padding: 9px 16px 9px 20px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--surface-2); }
.task { padding: 12px 16px 12px 20px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; transition: background .15s; }
.task:last-child { border-bottom: 0; border-radius: 0 0 var(--r) var(--r); }
.task:hover { background: var(--surface-2); }
.task::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 3px 3px 0; background: var(--st); }
.task.st-new { --st: var(--new); } .task.st-progress { --st: var(--prog); } .task.st-overdue { --st: var(--late); } .task.st-done { --st: var(--line); }
.task.st-done .t-name { color: var(--ink-2); }
.task.flash { animation: flash 2.4s ease-out; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
.t-who { min-width: 0; }
.t-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.t-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-sub { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-type { min-width: 0; display: grid; gap: 2px; }
.t-type .tag { justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.t-time { font-size: 13px; }
.t-time small { display: block; color: var(--muted); font-size: 12px; }
.t-due { font-size: 13px; }
.t-due small { display: block; font-size: 12px; color: var(--muted); }
.t-due.late small { color: var(--late); font-weight: 600; }
.t-due.soon small { color: var(--prog); font-weight: 600; }
.t-acts { display: flex; gap: 6px; justify-content: flex-end; }
.t-acts .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
.badge-ph { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--prog); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; line-height: 16px; flex: none; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty strong { color: var(--ink); font-family: var(--f-display); font-size: 16px; }

/* ---------- Drawer / modal ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.show { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(540px, 100%); background: var(--surface); z-index: 41; display: flex; flex-direction: column; box-shadow: var(--shadow); transform: translateX(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.show { transform: none; }
.d-head { padding: 18px 20px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.d-head-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.d-head h2 { font-size: 21px; }
.d-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.d-body { overflow-y: auto; flex: 1; padding: 18px 20px 24px; display: grid; gap: 22px; align-content: start; }
.d-sec { display: grid; gap: 10px; }
.kv { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 8px 12px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.reveal { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 0 0 0 6px; }

function seedState() {

    const task = { id, patient: { name: d.name, dob: d.dob, phone: d.phone, nhs: d.nhs }, type: d.type, items: d.items, said: d.said, summary: d.summary,
      createdAt: created, dueAt: t0 + d.due * MIN, status: d.st, owner: d.owner || null, callId, closedAt: null, closedBy: null, closeHow: null, events: [] };
    task.events.push({ at: created, by: "sys", kind: "create", text: "Task created from AI call" });
    if (d.owner) task.events.push({ at: created + rnd(4, 15) * MIN, by: d.owner, kind: "start", text: "Started working on this" });
    if (d.st === "done") {
      task.closedAt = t0 - d.closedAgo * MIN; task.closedBy = d.owner; task.closeHow = d.close;
      task.events.push(d.close === "sms"
        ? { at: task.closedAt, by: d.owner, kind: "sms", text: `Marked ready. Text sent to ${maskPhone(d.phone)}` }
        : { at: task.closedAt, by: d.owner, kind: "call", text: "Called back. Spoke to patient, resolved" });
      if (d.close === "sms") s.sms.push({ at: task.closedAt, to: d.phone, sid: "SM" + hex(32), status: "delivered", taskId: id });

    if (d.name === "Eileen O'Connor") task.events.push({ at: t0 - 40 * MIN, by: "tr", kind: "note", text: "Driver out on the north route until 1pm. Phoned patient, she's fine with early afternoon." });
    s.tasks.push(task);
    s.calls.push({ id: callId, at: created - durS * 1000, from: d.phone, caller: d.name, reason: TYPES[d.type].label, durS, outcome: "Task created", taskId: id,
      summary: d.summary, transcript: makeTranscript({ ...d, phone: d.phone }), sentiment: d.type === "question" ? "Neutral" : "Positive" });
    s.hooks.push(hookEvent(callId, created, d, durS));

      transcript: infoTranscript(reason), sentiment: "Positive" });
  }
  s.calls.push({ id: retellId(), at: t0 - 52 * MIN, from: "07700900666", caller: "Unknown caller", reason: "Transferred to staff", durS: 9, outcome: "Caller hung up", taskId: null, summary: "Caller hung up during the greeting.", transcript: [{ who: "agent", text: OPENERS[0] }], sentiment: "Unknown" });
  s.calls.sort((a, b) => b.at - a.at);
  // Audit history
  const A = (minsAgo, by, action, target, detail) => s.audit.push({ at: t0 - minsAgo * MIN, by, action, target, detail, ip: ipFor(by) });
  A(340, "ps", "auth.login", "Session", "Signed in with password and authenticator code");
  A(335, "tr", "auth.login", "Session", "Signed in with password and authenticator code");
  A(330, "ab", "auth.login", "Session", "Signed in with password and authenticator code");
  A(300, "do", "auth.login", "Session", "Signed in with password and authenticator code");
  s.tasks.forEach(t => t.events.forEach(e => {
    const map = { create: ["task.create", "Created from Retell webhook (call_analyzed)"], start: ["task.start", "Status changed: New → In progress"], sms: ["sms.send", `Text sent via Twilio to ${maskPhone(t.patient.phone)}. Task closed`], call: ["task.callback", "Logged call-back: resolved. Task closed"], note: ["task.note", "Added a note"] }[e.kind];
    if (map) s.audit.push({ at: e.at, by: e.by, action: map[0], target: t.id, detail: map[1], ip: ipFor(e.by) });

  const prev = S.audit.length ? S.audit[S.audit.length - 1].hash : "00000000";

function toast(title, sub = "", opts = {}) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<span class="tic">${ic(opts.icon || "check", "sm")}</span><div><strong>${esc(title)}</strong>${sub ? `<small>${esc(sub)}</small>` : ""}</div>${opts.action ? `<button type="button">${esc(opts.action)}</button>` : ""}`;
  $("#toasts").appendChild(el);
  let done = false;
  const close = () => { if (done) return; done = true; el.remove(); opts.onExpire && opts.onExpire(); };
  if (opts.action) $("button", el).onclick = () => { done = true; el.remove(); opts.onAction(); };
  setTimeout(close, opts.ms || 4200);
  return el;
}

function filteredTasks() {
  const q = UI.q.trim().toLowerCase();
  return S.tasks.filter(t => {
    const s = statusOf(t);
    if (UI.filter === "open" && s === "done") return false;
    if (UI.filter !== "open" && UI.filter !== "all" && s !== UI.filter) return false;
    if (UI.type !== "all" && t.type !== UI.type) return false;
    if (q && !(t.patient.name + " " + t.items.join(" ") + " " + t.id + " " + TYPES[t.type].label).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => {
    const rank = { overdue: 0, new: 1, progress: 2, done: 3 };
    const ra = rank[statusOf(a)], rb = rank[statusOf(b)];
    if (ra !== rb) return ra - rb;
    return statusOf(a) === "done" ? b.closedAt - a.closedAt : a.dueAt - b.dueAt;
  });
}
function dueCell(t) {
  const s = statusOf(t);
  if (s === "done") { const late = t.closedAt > t.dueAt; return `<div class="t-due"><span class="num">Closed ${fmtTime(t.closedAt)}</span><small>${late ? "After deadline" : "On time"}</small></div>`; }

  const day = isToday(t.dueAt) ? fmtTime(t.dueAt) : fmtDay(t.dueAt) + " " + fmtTime(t.dueAt);
  return `<div class="t-due ${m < 0 ? "late" : m < 30 ? "soon" : ""}"><span class="num">${day}</span><small>${m < 0 ? dur(m) + " overdue" : "in " + dur(m)}</small></div>`;
}

/* ================= Task actions ================= */
function setStatus(t, st, kind, text) {
  t.status = st;
  if (st === "done") { t.closedAt = now(); t.closedBy = S.user; t.closeHow = kind; }
  else { t.closedAt = null; t.closedBy = null; t.closeHow = null; }
  if (!t.owner && st !== "new") t.owner = S.user;
  t.events.push({ at: now(), by: S.user, kind, text });
}
function refreshAll() { save(); renderView(); if (UI.openTask) renderDrawer(); }
function smsText(t) {
  const n = firstName(t.patient.name);
  return {
    repeat: `Hi ${n}, your prescription is ready to collect from ${PHARMACY.name}, 14 Quay Street. We're open until 6:30pm today. Reply STOP to opt out.`,
    ready: `Hi ${n}, your prescription is ready to collect from ${PHARMACY.name}, 14 Quay Street. We're open until 6:30pm today. Reply STOP to opt out.`,
    delivery: `Hi ${n}, your medicines from ${PHARMACY.name} are out for delivery today between 1pm and 3pm. Please make sure someone is in. Reply STOP to opt out.`,
    stock: `Hi ${n}, good news: the item you asked about is now in stock at ${PHARMACY.name}. We've put it aside for you. Reply STOP to opt out.`,
    vaccine: `Hi ${n}, you're booked in at ${PHARMACY.name} on Thursday at 10:30. Please bring your NHS number if you have it. Reply STOP to opt out.`,
    question: `Hi ${n}, the pharmacist at ${PHARMACY.name} tried to reach you. Please call us on ${PHARMACY.phone}. Reply STOP to opt out.`,
    pfirst: `Hi ${n}, the pharmacist at ${PHARMACY.name} can see you today. Please come in any time before 6pm. Reply STOP to opt out.`,
  }[t.type];
}
function sendSms(t, body, delayMs) {
  const prevSnap = JSON.stringify({ status: t.status, owner: t.owner, closedAt: t.closedAt, closedBy: t.closedBy, closeHow: t.closeHow, events: t.events });
  setStatus(t, "done", "sms", `Marked ready. Text sent to ${maskPhone(t.patient.phone)}`);
  refreshAll();
  const commit = () => {
    const sid = "SM" + hex(32);
    S.sms.push({ at: now(), to: t.patient.phone, sid, status: "delivered", taskId: t.id, body });
    audit("sms.send", t.id, `Text sent via Twilio to ${maskPhone(t.patient.phone)}. Task closed`);
    save(); if (route() === "audit") renderView();
    toast(`Text delivered to ${t.patient.name}`, `Twilio ${sid.slice(0, 14)}… · status: delivered`, { icon: "msg" });
  };
  if (!delayMs) { commit(); return; }
  toast(`Texting ${t.patient.name}…`, `Sending in ${delayMs / 1000}s. Task moved to Done.`, {
    icon: "msg", action: "Undo", ms: delayMs, onExpire: commit,
    onAction: () => { Object.assign(t, JSON.parse(prevSnap)); refreshAll(); toast("Text cancelled", "Nothing was sent. Task restored.", { icon: "reopen" }); },
  });
}
function quickAct(act, t) {
  if (act === "ready") sendSms(t, smsText(t), 4000);
  else if (act === "called") openCalledBack(t);
  else if (act === "reopen") reopen(t);
}
function reopen(t) { setStatus(t, "progress", "reopen", "Reopened"); audit("task.reopen", t.id, "Status changed: Done → In progress"); refreshAll(); toast(`${t.id} reopened`, t.patient.name, { icon: "reopen" }); }
function startTask(t) { setStatus(t, "progress", "start", "Started working on this"); t.owner = S.user; audit("task.start", t.id, "Status changed: New → In progress"); refreshAll(); toast(`You're on ${t.id}`, t.patient.name, { icon: "start" }); }

/* ================= Simulated Retell call ================= */
let simBusy = false;
function simulateCall() {

  simBusy = true;

  UI.incoming = { phone: d.phone, stage: "Greeting caller" }; renderIncoming();
  const stages = ["Confirming name and date of birth", `Capturing request: ${TYPES[d.type].label.toLowerCase()}`, "Call ended · analysing"];
  stages.forEach((st, i) => setTimeout(() => { if (UI.incoming) { UI.incoming.stage = st; renderIncoming(); } }, 1300 * (i + 1)));
  setTimeout(() => {

    const t0 = now(), id = "T-" + (S.seq++), callId = retellId(), durS = rnd(80, 170);
    const task = { id, patient: { name: d.name, dob: d.dob, phone: d.phone, nhs: d.nhs }, type: d.type, items: d.items, said: d.said, summary: d.summary,

      events: [{ at: t0, by: "sys", kind: "create", text: "Task created from AI call" }] };

    S.hooks.push(hookEvent(callId, t0, d, durS));

  }, 5400);
}

          <div class="cols">${[0, 25, 50, 75, 100].map(v => `<div class="grid-l" style="bottom:${v}%"><span>${v}%</span></div>`).join("")}<div class="target" style="bottom:90%"></div>
            <div class="bars-c">${days.map(d => { const p = d.closed ? Math.round(d.onTime / d.closed * 100) : 0; return `<div class="col ${d.closed ? "" : "dim"}" data-tip="${d.today ? "Today" : fmtDay(d.ts)}: <b>${d.closed ? p + "%" : "closed"}</b>${d.closed ? ` (${d.onTime} of ${d.closed})` : ""}"><i style="height:${d.closed ? p : 0}%"></i></div>`; }).join("")}</div></div>
          <div class="x-axis">${days.map(d => `<span>${d.today ? "Today" : new Date(d.ts).toLocaleDateString("en-GB", { weekday: "short" })}</span>`).join("")}</div>
        </div></section>
      <section class="panel wide"><div class="panel-head"><h2>Calls by hour, today</h2><span class="muted">Busiest: ${(() => { const b = hours.reduce((a, x) => x.n > a.n ? x : a, hours[0]); return b.n ? `${pad(b.h)}:00 to ${pad(b.h + 1)}:00 (${b.n} calls)` : "no calls yet"; })()}</span></div>
        <div class="panel-body">
          <div class="cols">${Array.from({ length: topH / stepH + 1 }, (_, i) => i * stepH).map(v => `<div class="grid-l" style="bottom:${v / topH * 100}%"><span>${v}</span></div>`).join("")}
            <div class="bars-c">${hours.map(x => `<div class="col ${x.h > curH ? "dim" : ""}" data-tip="${pad(x.h)}:00 to ${pad(x.h + 1)}:00: <b>${x.n}</b> call${x.n === 1 ? "" : "s"}"><i style="height:${x.n / topH * 100}%"></i></div>`).join("")}</div></div>
          <div class="x-axis">${hours.map(x => `<span>${pad(x.h)}</span>`).join("")}</div>
        </div></section>
    </div>
  </div>`;
  $$("[data-r]").forEach(b => b.onclick = () => { UI.range = b.dataset.r; viewReports(); });
}

/* ================= Audit view ================= */
const ACTION_LABEL = { "auth.login": "Signed in", "auth.logout": "Signed out", "task.create": "Task created", "task.view": "Viewed record", "task.start": "Started task", "task.note": "Added note", "task.callback": "Logged call-back", "task.reopen": "Reopened task", "sms.send": "Sent SMS", "patient.view_phone": "Viewed contact details", "call.play_recording": "Played recording", "call.open_transcript": "Opened transcript", "call.open_recording": "Opened recording" };
function viewAudit() {
  const kinds = { all: "All actions", auth: "Sign-ins", task: "Task changes", sms: "Texts sent", patient: "Record access", call: "Call recordings" };
  const list = S.audit.filter(e => (UI.auditWho === "all" || e.by === UI.auditWho) && (UI.auditKind === "all" || e.action.startsWith(UI.auditKind + ".") || (UI.auditKind === "patient" && e.action === "task.view"))).slice().reverse();
  $("#main").innerHTML = `
  <div class="page">
    <div class="page-head"><div><h1>Audit trail</h1><p class="sub">Every sign-in, record view and change, by named member of staff</p></div></div>
    <div class="callout">${ic("shield")}<p><strong>Append-only and tamper-evident.</strong> Each entry stores a hash of the one before it, so an edited or deleted row breaks the chain. Entries are kept for 8 years in line with NHS records guidance, and can be exported for a DSPT audit or a subject access request.</p></div>
    <section class="panel">
      <div class="toolbar">
        <select class="select" id="a-who" aria-label="Staff member"><option value="all">All staff</option>${[...STAFF, staff("sys")].map(s => `<option value="${s.id}" ${UI.auditWho === s.id ? "selected" : ""}>${s.name}</option>`).join("")}</select>
        <select class="select" id="a-kind" aria-label="Action type">${Object.entries(kinds).map(([k, v]) => `<option value="${k}" ${UI.auditKind === k ? "selected" : ""}>${v}</option>`).join("")}</select>
        <span class="muted num" style="margin-left:auto">${list.length} entries</span>
      </div>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Time</th><th>Staff</th><th>Action</th><th>Record</th><th>Detail</th><th>Device</th><th>Chain</th></tr></thead>
      <tbody>${list.slice(0, 200).map(e => `<tr class="${e.fresh ? "fresh" : ""}"><td class="mono">${isToday(e.at) ? "" : fmtDay(e.at) + " "}${fmtTimeS(e.at)}</td><td><span class="who">${av(e.by)} ${esc(staff(e.by).name)}</span></td><td><span class="act">${ACTION_LABEL[e.action] || e.action}</span><br><span class="act-k">${e.action}</span></td><td class="mono">${esc(e.target)}</td><td>${esc(e.detail)}</td><td class="muted" style="white-space:nowrap">${esc(e.ip)}</td><td class="mono chain">${e.hash}</td></tr>`).join("") || `<tr><td colspan="7"><div class="empty"><strong>No entries</strong><span>Try a different filter.</span></div></td></tr>`}</tbody></table></div>
    </section>
  </div>`;
  $("#a-who").onchange = e => { UI.auditWho = e.target.value; viewAudit(); };
  $("#a-kind").onchange = e => { UI.auditKind = e.target.value; viewAudit(); };
}

/* ================= Connections view ================= */
function viewConnections() {
  const hooks = S.hooks.slice().sort((a, b) => b.at - a.at).slice(0, 8);
  const smsToday = S.sms.filter(s => isToday(s.at));
  const ENDPOINT = "https://api.counterline.co.uk/webhooks/retell/fq842";
  $("#main").innerHTML = `
  <div class="page">
    <div class="page-head"><div><h1>Connections</h1><p class="sub">How calls get in, how texts go out, and where the data lives</p></div>
      <div class="actions"><button class="btn primary" type="button" id="cn-test">${ic("bolt", "sm")} Send a test call result</button></div></div>
    <div class="conn-grid">
      <div class="conn-stack">
        <section class="panel">
          <div class="panel-head"><div class="svc-head"><span class="svc-logo">${ic("phone")}</span><div><h2>Retell AI voice agent</h2><span class="muted" style="font-size:12.5px">Receives call results and turns them into tasks</span></div></div><span class="pill done">Receiving</span></div>
          <div class="panel-body" style="display:grid;gap:14px">
            <div class="endpoint"><span class="method">POST</span><code id="cn-url">${ENDPOINT}</code><button class="icon-btn" type="button" id="cn-copy" aria-label="Copy webhook URL">${ic("copy", "sm")}</button></div>
            <ul class="checks">
              <li>${ic("check", "sm")}<span>Signature checked on every request<small>Requests without a valid x-retell-signature are rejected with 401</small></span></li>
              <li>${ic("check", "sm")}<span>Duplicate-safe<small>Each call_id creates one task, even if Retell retries</small></span></li>
              <li>${ic("check", "sm")}<span>Listens for call_analyzed<small>Summary, extracted patient fields, transcript and recording link</small></span></li>
            </ul>
          </div>
          <div class="panel-head" style="border-top:1px solid var(--line)"><h3>Recent webhook deliveries</h3><span class="muted num" style="font-size:12.5px">${S.hooks.length} today · all accepted</span></div>
          <div>${hooks.map(h => `<details class="evt"><summary><span class="mono">${fmtTimeS(h.at)}</span><strong>${h.type} · ${h.callId.slice(0, 16)}…</strong><span class="code200">${h.status} · ${h.ms}ms</span></summary><pre>${esc(JSON.stringify(h.payload, null, 2))}</pre></details>`).join("")}</div>
        </section>
      </div>
      <div class="conn-stack">
        <section class="panel">
          <div class="panel-head"><div class="svc-head"><span class="svc-logo">${ic("msg")}</span><div><h2>Twilio SMS</h2><span class="muted" style="font-size:12.5px">Texts patients when a task is ready</span></div></div><span class="pill done">Connected</span></div>
          <div class="panel-body"><div class="kv-tight">
            <span>Sender name</span><span>HARBOURSIDE</span>
            <span>Texts sent today</span><span>${smsToday.length}</span>
            <span>Delivered</span><span>${smsToday.length ? "100%" : "–"}</span>
            <span>Opt-outs honoured</span><span>STOP / START</span>
            <span>Delivery receipts</span><span>Status callback on</span>
          </div></div>
        </section>
        <section class="panel">
          <div class="panel-head"><div class="svc-head"><span class="svc-logo">${ic("server")}</span><div><h2>Hosting and data</h2><span class="muted" style="font-size:12.5px">Where patient data is stored</span></div></div></div>
          <div class="panel-body"><ul class="checks">
            <li>${ic("check", "sm")}<span>AWS London region (eu-west-2)<small>App, database and backups stay in the UK</small></span></li>
            <li>${ic("check", "sm")}<span>PostgreSQL, encrypted at rest<small>AWS KMS keys, TLS 1.2+ in transit</small></span></li>
            <li>${ic("check", "sm")}<span>Two-step sign-in for every account<small>Authenticator app, 15-minute idle lock</small></span></li>
            <li>${ic("check", "sm")}<span>Least-privilege roles<small>Counter staff see masked contact details by default</small></span></li>
            <li>${ic("check", "sm")}<span>Retention you control<small>Recordings 90 days, tasks 8 years, audit 8 years</small></span></li>
          </ul></div>
        </section>
      </div>
    </div>
  </div>`;
  $("#cn-test").onclick = () => { location.hash = "tasks"; setTimeout(simulateCall, 50); };
  $("#cn-copy").onclick = () => {
    const done = () => toast("Webhook URL copied", ENDPOINT, { icon: "copy" });
    try { navigator.clipboard.writeText(ENDPOINT).then(done, () => { selectText($("#cn-url")); toast("Press Ctrl+C to copy", "The URL is selected", { icon: "copy" }); }); }
    catch (e) { selectText($("#cn-url")); }
  };
}
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

/* ================= Boot & live loop ================= */
function boot() {
  if (!S.user) { renderLogin(); return; }
  renderShell(); renderView();
}
try { const th = localStorage.getItem("counterline-theme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
window.addEventListener("hashchange", () => { if (S.user) { closeDrawer(); renderView(); window.scrollTo(0, 0); } });

// Live refresh: countdowns and overdue flips without reloading the page
setInterval(() => {
  if (!S.user) return;
  renderNav();
  if (route() === "tasks") { renderKpis(); renderTaskList(); }
  if (UI.openTask && !$(".modal")) renderDrawer();
}, 20000);
// Auto-simulated incoming calls
let nextSim = now() + 35000;
setInterval(() => {
  if (!S.user || !S.autoSim || simBusy || $(".modal")) return;
  if (now() >= nextSim) { simulateCall(); nextSim = now() + rnd(70, 120) * 1000; }
}, 3000);

boot();
})();
</script>
